<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Breakout Game</title>
</head>

<body style="margin:0;">

<canvas id="myCanvas" width="500" height="500"
style="border:1px solid rgb(255, 0, 0)"></canvas>

<script>
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    ctx.font = "16px Arial";
    ctx.fillStyle = "#0095DD";
    ctx.fillText("Оноо : " + 0, 20, 20);

    ctx.font = "16px Arial";
    ctx.fillStyle = "#0095DD";
    ctx.fillText("Амь: " + 3, 420, 20);

//1dh egnee
    ctx.beginPath();
    ctx.rect(30, 30, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(110, 30, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(190, 30, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();


//2dh egnee
    ctx.beginPath();
    ctx.rect(30, 70, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(110, 70 , 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(190, 70, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
//3dh egnee
    ctx.beginPath();
    ctx.rect(30, 110, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(110, 110, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(190, 110, 60, 20);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

    
//tawtsn
    ctx.beginPath();
    ctx.rect(200, 400, 80, 10);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
//bombg
    ctx.beginPath();
    ctx.arc(240, 390, 10, 0, 2 * 3.14, false);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();

</script>

</body>
</html>
